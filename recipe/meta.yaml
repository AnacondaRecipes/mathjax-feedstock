{% set name = "mathjax" %}
{% set version = "4.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/mathjax/MathJax/archive/{{ version }}.tar.gz
  sha256: 0f234da8c0198576101cad9646753bce10e3c9db6f323220403eca7a819271c9

build:
  number: 0

requirements:

test:
  requires:
    - m2-bash  # [win]
  commands:
    - mathjax-path  # [unix]
    - cmd /c "%PREFIX%\Scripts\mathjax-path.bat"  # [win]
    - bash "%PREFIX%\Scripts\mathjax-path"  # [win]

about:
  home: https://github.com/mathjax/MathJax
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: |
    Beautiful math in all browsers. MathJax is an open-source JavaScript display engine
    for LaTeX, MathML, and AsciiMath notation that works in all browsers. (use mathjax-path script)
  description: |
    MathJax is a JavaScript library that enables the rendering of mathematical equations
    and symbols on web pages. It provides a powerful and flexible solution for displaying
    math content in a browser without the need for plugins or specific fonts. MathJax supports
    a wide range of math markup languages, including LaTeX, MathML, and AsciiMath.
  doc_url: https://github.com/mathjax/MathJax
  dev_url: https://github.com/mathjax/MathJax

extra:
  recipe-maintainers:
    - kiwi0fruit
    - tdegeus
